<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="./js/main.js"></script>
    <link rel="stylesheet" href="./css/styles.css">
    <title>Pre Entrega 7</title>
</head>

<body>
    <header id="header">
        <h1>BoxGym</h1>
        <h2>Panel de Administracion</h2>
    </header>
    <main>
        <div id="formulario">
            <h3>Formulario de Nuevos Miembros</h3>
            <p>LLene los datos del nuevo miembro para agregarlo a la lista</p>
            <form id="form">
                <ul class="formularioM">
                    <li>
                        <h4>Nombre</h4><input type="text"  name="nombre" placeholder="Ej: Juan Pérez" pattern="^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$" title="Solo se permiten letras y espacios, sin números ni símbolos" required>
                    </li>
                    <li>
                        <h4>Edad</h4><input name="edad" type="number" required>
                    </li>
                    <li>
                        <h4>Dni</h4><input name="dni" type="number" required>
                    </li>
                    <li>
                        <h4>Disciplina</h4>                    
                            <select name="disciplinas" required>
                            <option value="" disabled selected>Selecciona una opción</option>
                            <option value="Musculacion">Musculación</option>
                            <option value="Crossfit">Crossfit</option>
                            <option value="Boxeo">Boxeo</option>
                        </select>
                    </li>
                    <li>
                        <h4>Dias de entrenamiento por semana</h4>                       
                            <select name="dias" required>
                            <option value="" disabled selected>Selecciona una opción</option>
                            <option>Dos dias a la semana</option>
                            <option>Tres dias a la semana</option>
                            <option>Cinco dias a la semana</option>
                        </select>
                    </li>
                    <input type="submit" class="boton" value="Enviar">
                </ul>
            </form>
        </div>
        <p id="mensaje-feedback"></p>
        <div id="formfiltracion">
            <form>
                <ul class="formularioF">
                    <h4>Filtrar miembros por disciplina</h4>
                    <li><label>Disciplina:</label>
                        <select id="disciplina" name="disciplina" required>
                            <option>Selecciona una opción</option>
                            <option>Musculacion</option>
                            <option>Crossfit</option>
                            <option>Boxeo</option>
                        </select>
                        <input type="submit" class="boton">
                    </li>
                </ul>
            </form>

        </div>
        <h3>Tarjeta de miembros</h3>
        <div id="container"></div>
    </main>


</body>

</html>
